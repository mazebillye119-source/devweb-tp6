<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Réducteur d'URL - Client</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 640px;
                margin: 2rem auto;
                padding: 1rem;
                color: #222;
            }
            h1 { margin-bottom: 1rem; }
            form {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                margin-top: 1rem;
            }
            input, button {
                padding: 0.6rem;
                font-size: 1rem;
                border-radius: 4px;
                border: 1px solid #ccc;
            }
            button {
                background: #06c;
                color: white;
                cursor: pointer;
                border: none;
            }
            button:hover { background: #05a; }
            .result {
                background: #eef;
                border-left: 4px solid #06c;
                padding: 1rem;
                border-radius: 4px;
                margin-top: 1rem;
                word-break: break-all;
            }
            .error {
                background: #fee;
                border-left-color: #900;
                color: #900;
            }
            a { color: #06c; }
            .copy-btn {
                margin-left: 0.5rem;
                background: #080;
            }
            .copy-btn:hover { background: #060; }
        </style>
    </head>
    <body>
        <h1>Réducteur d'URL</h1>

        <div id="result" hidden></div>

        <form id="shorten-form">
            <label for="url">Type the URL to shorten</label>
            <input
                name="url"
                id="url"
                type="url"
                placeholder="https://perdu.com"
                required
            />
            <button type="submit">Submit</button>
        </form>

        <script src="/app.js"></script>
    </body>
</html>
